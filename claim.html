<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoloHub — Claim Free Key</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0505;
      background-image:
        radial-gradient(800px 400px at 20% 0%, rgba(220,38,38,.2), transparent 50%),
        radial-gradient(600px 300px at 100% 100%, rgba(127,29,29,.25), transparent 45%);
      color: #fff5f5;
      padding: 20px;
    }
    .card {
      width: min(420px, 100%);
      background: linear-gradient(165deg, #1c0f0f, #120808);
      border: 1px solid #5a1a1a;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.06) inset,
        0 12px 32px rgba(0,0,0,.5);
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #e8b4b4; font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
    .key-box {
      background: #1a0808;
      border: 1px dashed #8b2525;
      border-radius: 12px;
      padding: 16px;
      font-family: ui-monospace, monospace;
      font-size: 15px;
      color: #fecaca;
      word-break: break-all;
      margin-bottom: 14px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .meta { font-size: 12px; color: #d4a5a5; margin-bottom: 16px; }
    .meta strong { color: #fecaca; }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-main {
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      color: #fff;
      box-shadow: 0 4px 14px rgba(185,28,28,.4);
    }
    .btn-main:disabled { opacity: .5; cursor: not-allowed; }
    .btn-ghost {
      background: #1a0a0a;
      color: #fecaca;
      border: 1px solid #5a2020;
    }
    .status { font-size: 13px; margin-top: 8px; color: #fbbf24; }
    .ok { color: #86efac; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 SoloHub Free Key</h1>
    <p>Key gratis otomatis · berlaku <strong>24 jam</strong> dari sekarang.<br>
       Copy key ini, paste di script / website SoloHub.</p>

    <div class="key-box" id="keyBox">Generating...</div>
    <div class="meta" id="metaBox">—</div>

    <button class="btn-main" id="copyBtn" disabled onclick="copyKey()">Copy Key</button>
    <button class="btn-ghost" onclick="location.reload()">Generate Key Baru</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    // Firebase config (sama seperti SoloHub panel)
    const firebaseConfig = {
      apiKey: "AIzaSyDBfcqiE1p1r0h9rePhhJN9BhvaC0GmEUY",
      authDomain: "solohub-db010.firebaseapp.com",
      databaseURL: "https://solohub-db010-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "solohub-db010"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function randomKey() {
      const p = () => Math.random().toString(36).slice(2, 8).toUpperCase();
      return `FREE-${p()}-${p()}-${p()}`;
    }

    function formatTime(ms) {
      try { return new Date(ms).toLocaleString(); } catch { return String(ms); }
    }

    let currentKey = "";

    async function createKey() {
      const status = document.getElementById("status");
      const keyBox = document.getElementById("keyBox");
      const meta = document.getElementById("metaBox");
      const copyBtn = document.getElementById("copyBtn");
      status.textContent = "Menulis ke Firebase...";
      status.className = "status";
      keyBox.textContent = "Generating...";
      copyBtn.disabled = true;

      const key = randomKey();
      const now = Date.now();
      const expiresAt = now + 24 * 60 * 60 * 1000; // 24 jam

      const payload = {
        type: "free",
        createdAt: now,
        expiresAt: expiresAt,
        active: true,
        usedBy: null,
        accounts: [],
        note: "auto-claim",
        source: "claim.html"
      };

      try {
        await db.ref("soloHub/keys/" + key).set(payload);
        currentKey = key;
        keyBox.textContent = key;
        meta.innerHTML = `Type: <strong>Free</strong> · Expired: <strong>${formatTime(expiresAt)}</strong>`;
        copyBtn.disabled = false;
        status.textContent = "✅ Key siap dipakai";
        status.className = "status ok";
      } catch (e) {
        keyBox.textContent = "Gagal";
        status.textContent = "❌ " + e.message + " — cek Firebase Rules (write harus allowed)";
        status.className = "status err";
      }
    }

    function copyKey() {
      if (!currentKey) return;
      navigator.clipboard.writeText(currentKey).then(() => {
        document.getElementById("status").textContent = "✅ Key di-copy!";
        document.getElementById("status").className = "status ok";
      }).catch(() => {
        // fallback
        const t = document.createElement("textarea");
        t.value = currentKey;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        t.remove();
        document.getElementById("status").textContent = "✅ Key di-copy!";
      });
    }

    createKey();
  </script>
</body>
</html>
